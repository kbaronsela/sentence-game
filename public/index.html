<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fef6f0" />
    <title>משחקי ילדות</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/home.css" />
  </head>
  <body>
    <div class="home-bg" aria-hidden="true"></div>
    <main class="home-shell">
      <header class="home-hero">
        <h1>משחקי ילדות</h1>
        <p class="home-tagline">בחרו משחק והתחילו — מהמחשב או מהטלפון</p>
      </header>

      <nav class="game-grid" aria-label="בחירת משחק">
        <a class="game-card" href="/sentence-game/">
          <span class="game-card-icon" aria-hidden="true">📜</span>
          <h2>סיפור במשפטים</h2>
          <p>משחק משותף של סיפור — כל אחד רואה רק את המילה האחרונה מהתור הקודם.</p>
        </a>
        <a class="game-card" href="/rps/">
          <span class="game-card-icon" aria-hidden="true">📌</span>
          <h2>אבן נייר ומספריים</h2>
          <p>מול חבר או מול בוט — בוחרים אבן, נייר או מספריים ומגלים מי מנצח.</p>
        </a>
      </nav>
    </main>
  </body>
</html>
